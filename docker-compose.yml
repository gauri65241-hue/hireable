services:
  hireable:
    build: .
    expose:
      - "8000"
    env_file: .env
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      # REQUIRED: set a strong random JWT secret before deploying.
      # Generate with: python -c "import secrets; print(secrets.token_hex(32))"
      - JWT_SECRET=${JWT_SECRET:-change-me-before-deploying}
      # Optional: restrict to specific origin in production
      # - ALLOWED_ORIGINS=https://yourdomain.com
    volumes:
      - ./data:/app/data
      - hireable_db:/app/results
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    expose:
      - "11434"
    volumes:
      - ollama_models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    depends_on:
      - hireable
    restart: unless-stopped

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: ["sh", "-c", "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"]
    restart: unless-stopped

volumes:
  ollama_models:
  hireable_db:
  certbot_webroot:
  certbot_certs:
