# Replace YOUR_DOMAIN with your actual domain (e.g. hireable.yourdomain.com)
# after running certbot once, uncomment the HTTPS server block below.

events {
    worker_connections 1024;
}

http {
    # Rate limiting — 30 requests/minute per IP on /analyze endpoints
    limit_req_zone $binary_remote_addr zone=analyze_limit:10m rate=30r/m;

    # Disable server version header
    server_tokens off;

    # ── HTTP — redirect to HTTPS + serve certbot challenges ──────────────────
    server {
        listen 80;
        server_name YOUR_DOMAIN;

        # Certbot ACME challenge path (needed for SSL cert issuance)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS ─────────────────────────────────────────────────────────────────
